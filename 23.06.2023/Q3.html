<!DOCTYPE html>
<html>
<head>
    <title>Calculate Circle Area</title>
</head>
<body>
    <script>
        
        function cArea() {
            
            var radius = prompt("Enter the radius of the circle:");

            
            radius = parseFloat(radius);

           
            var area = Math.PI * radius * radius;

            
            alert("The area of the circle is: " + area.toFixed(2));
        }

        
        cArea();
    </script>
</body>
</html>
